name: リール 暫定投稿（一度きり）

# 8/21 19:00 のリールが待機ステップの不具合で投稿できなかったぶんを、
# 8/22 11:00 JST に出し直すための使い捨てワークフローです。
#
# 動画は 8/21 の実行で作られて GitHub Pages 上に公開済みなので、
# 組み立て直さずにそのまま投稿します。
#
# cron は「8月22日」を指定しているため、来年まで再発火しません。
# 投稿が済んだらこのファイルは削除してください。

on:
  schedule:
    # 8月22日 02:00 UTC = 8月22日 11:00 JST
    - cron: "0 2 22 8 *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "投稿せず内容だけ表示する"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: reel-post
  cancel-in-progress: false

env:
  TARGET_DATE: "2026-08-21"

jobs:
  reel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 依存関係をインストール
        run: pip install -r requirements.txt

      - name: 動画が公開されているか確認
        env:
          PAGES_BASE_URL: ${{ vars.PAGES_BASE_URL || 'https://wyattfuji1220.github.io/Instagram' }}
        run: |
          set -euo pipefail
          URL="${PAGES_BASE_URL%/}/img/$TARGET_DATE/reel.mp4"
          echo "確認: $URL"
          curl -sfI "$URL" >/dev/null

      - name: リールを投稿
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          PAGES_BASE_URL: ${{ vars.PAGES_BASE_URL || 'https://wyattfuji1220.github.io/Instagram' }}
          IG_API_HOST: ${{ vars.IG_API_HOST || 'https://graph.facebook.com' }}
          PYTHONPATH: src
        run: |
          python -m bookgram post-reel --date "$TARGET_DATE" \
            ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: 動画を片付けて記録をコミット
        if: ${{ !inputs.dry_run }}
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain)" ]; then
            echo "記録の変更はありません。"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "リール: 暫定投稿の記録と動画の削除 ($TARGET_DATE 分)"
          git pull --rebase origin main
          git push origin main

      - name: 失敗を通知
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "リールの暫定投稿に失敗しました ($TARGET_DATE 分)" \
            --body "ログ: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
