name: 週3 リール投稿

# 投稿済みのカード画像を縦動画にして、リールとして流します。
# 生成AIは使わないので、この分の追加費用はかかりません。
#
# 動画は Instagram に渡すために公開URLが要るため、いったん docs/ に置いて
# GitHub Pages に載せ、投稿が終わったら削除します（リポジトリに溜めないため）。

on:
  schedule:
    # 月・水・金 19:00 JST = 同日 10:00 UTC
    - cron: "0 10 * * 1,3,5"
  workflow_dispatch:
    inputs:
      date:
        description: "元にする投稿日 (YYYY-MM-DD)。空なら自動選択。"
        required: false
      dry_run:
        description: "投稿せず内容だけ表示する"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: reel-post
  cancel-in-progress: false

jobs:
  reel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 依存関係をインストール
        # cli は generate / render を読み込むため、投稿だけでも一式が要る。
        # ブラウザ本体は描画しないので入れない。
        run: pip install -r requirements.txt

      - name: 動画を組み立て
        id: build
        env:
          PYTHONPATH: src
        # pipefail が無いとパイプの終了コードが tee のものに置き換わり、
        # python が落ちても成功扱いになる。ここで一度それに嵌まっている。
        # 対象日と中断の有無は bookgram 側がステップ出力に書く。
        run: |
          set -o pipefail
          mkdir -p output
          python -m bookgram reel \
            ${{ inputs.date && format('--date {0}', inputs.date) || '' }} \
            2>&1 | tee output/reel-build.log

      - name: 失敗したときは記録を残す
        if: failure()
        # Actions のログは管理者しか読めない。原因をリポジトリ側に残す。
        run: |
          set -euo pipefail
          [ -f output/reel-build.log ] || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f output/reel-build.log
          git diff --cached --quiet && exit 0
          git commit -m "リール: 失敗時のログ ($(date -u -d '+9 hours' +%Y-%m-%d))"
          git pull --rebase origin main
          git push origin main

      - name: 動画を公開（GitHub Pages 経由）
        if: steps.build.outputs.skipped != 'true'
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain)" ]; then
            echo "新しい動画はありません。"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "リール: 動画を追加 ($(date -u -d '+9 hours' +%Y-%m-%d))"
          git push origin main

      - name: Pages への反映を待つ
        if: steps.build.outputs.skipped != 'true' && !inputs.dry_run
        env:
          PAGES_BASE_URL: ${{ vars.PAGES_BASE_URL || 'https://wyattfuji1220.github.io/Instagram' }}
        run: |
          set -euo pipefail
          BASE="${PAGES_BASE_URL%/}"
          URL="$BASE/img/${{ steps.build.outputs.date }}/reel.mp4"
          echo "待機対象: $URL"
          # Pages のデプロイは通常1〜3分。10分待って駄目なら失敗させる。
          for i in $(seq 1 40); do
            if curl -sfI "$URL" >/dev/null; then
              echo "公開を確認しました（${i}回目）。"
              exit 0
            fi
            sleep 15
          done
          echo "::error::動画が公開されませんでした: $URL"
          exit 1

      - name: リールを投稿
        if: steps.build.outputs.skipped != 'true'
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          # 音源ライブラリ用。未設定なら音源なしで投稿される。
          FB_IG_USER_ID: ${{ secrets.FB_IG_USER_ID }}
          FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}
          PAGES_BASE_URL: ${{ vars.PAGES_BASE_URL || 'https://wyattfuji1220.github.io/Instagram' }}
          IG_API_HOST: ${{ vars.IG_API_HOST || 'https://graph.facebook.com' }}
          PYTHONPATH: src
        run: |
          python -m bookgram post-reel \
            --date ${{ steps.build.outputs.date }} \
            ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: 動画を片付けて記録をコミット
        if: ${{ steps.build.outputs.skipped != 'true' && !inputs.dry_run }}
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain)" ]; then
            echo "記録の変更はありません。"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "リール: 投稿記録と動画の削除 ($(date -u -d '+9 hours' +%Y-%m-%d))"
          git pull --rebase origin main
          git push origin main

      - name: 失敗を通知
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "リール投稿に失敗しました ($(date -u -d '+9 hours' +%Y-%m-%d))" \
            --body "ログ: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
