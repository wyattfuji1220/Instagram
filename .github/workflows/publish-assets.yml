name: 画像を公開用リポジトリへ送る

# カード画像と動画は Instagram に公開URLで渡す必要があるため、公開リポジトリ
# （Instagram-assets）から GitHub Pages で配信します。本体は読書メモや原稿を
# 抱えているので公開できません。docs/img が変わるたびに、その中身だけを
# 公開側へ写します。
#
# 本体側の docs/img も当面は残します。PAGES_BASE_URL を戻せばいつでも
# 元の配信に切り替えられるようにしておくためです。

on:
  push:
    branches: [main]
    paths:
      - "docs/img/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-assets
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: 公開用リポジトリへ写す
        env:
          TOKEN: ${{ secrets.ASSETS_TOKEN }}
        run: bash scripts/publish-assets.sh
