name: 画像を公開用リポジトリへ送る

# カード画像と動画は Instagram に公開URLで渡す必要があるため、公開リポジトリ
# （Instagram-assets）から GitHub Pages で配信します。本体は読書メモや原稿を
# 抱えているので公開できません。docs/img が変わるたびに、その中身だけを
# 公開側へ写します。
#
# 本体側の docs/img も当面は残します。PAGES_BASE_URL を戻せばいつでも
# 元の配信に切り替えられるようにしておくためです。

on:
  push:
    branches: [main]
    paths:
      - "docs/img/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-assets
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: 公開用リポジトリを取得
        env:
          TOKEN: ${{ secrets.ASSETS_TOKEN }}
        run: |
          set -uo pipefail
          mkdir -p output
          exec > >(tee output/assets-check.md) 2>&1
          # 値は伏せたまま、どこで失敗したかが分かるようにする。
          if [ -z "${TOKEN:-}" ]; then
            echo "::error::ASSETS_TOKEN が設定されていません。"
            exit 1
          fi
          echo "トークンの長さ: ${#TOKEN}"
          case "$TOKEN" in
            github_pat_*) echo "種類: fine-grained" ;;
            ghp_*)        echo "種類: classic" ;;
            *)            echo "種類: 不明" ;;
          esac
          code=$(curl -s -o /tmp/repo.json -w "%{http_code}"             -H "Authorization: Bearer ${TOKEN}"             -H "Accept: application/vnd.github+json"             https://api.github.com/repos/wyattfuji1220/Instagram-assets)
          echo "リポジトリ照会: HTTP ${code}" 
          if [ "$code" != "200" ]; then
            echo "::error::トークンで Instagram-assets を参照できません（HTTP ${code}）。"
            head -c 300 /tmp/repo.json
            exit 1
          fi
          grep -o '"push":[a-z]*' /tmp/repo.json | head -1
          set -e
          git clone --depth 1             "https://x-access-token:${TOKEN}@github.com/wyattfuji1220/Instagram-assets.git"             assets

      - name: 画像を写して送る
        run: |
          set -euo pipefail
          # 消えた日付フォルダも反映させたいので --delete で丸ごと合わせる。
          rsync -a --delete docs/img/ assets/img/
          cd assets
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "変更はありません。"
            exit 0
          fi
          git commit -m "画像を更新 ($(date -u -d '+9 hours' +%Y-%m-%d\ %H:%M))"
          git push origin main

      - name: 診断結果を残す
        if: always()
        # Actions のログは管理者しか読めない。原因をリポジトリ側に残す。
        run: |
          set -euo pipefail
          [ -f output/assets-check.md ] || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f output/assets-check.md
          git diff --cached --quiet && exit 0
          git commit -m "画像送信の診断結果"
          git pull --rebase origin main
          git push origin main
