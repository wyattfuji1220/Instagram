name: 毎日 Instagram 投稿

on:
  schedule:
    # 狙いは 07:00 JST 着地。GitHub Actions の定時実行は共有マシンの混雑で
    # 数十分ずれ、実測では毎回55分前後の遅れが出ていた（08:02 / 07:57 / 07:54）。
    # その分を見込んで1時間前倒しし、06:00 JST = 前日 21:00 UTC で予約する。
    - cron: "0 21 * * *"
  # 外部の定時サービスから叩いてもらう入口。GitHub の schedule は
  # 2026-09-02 以降、遅れが数分から2〜4時間に悪化して時刻を守れない。
  # schedule は保険として残す（外部が落ちても、遅れて必ず動く）。
  repository_dispatch:
    types: [post-carousel]
  workflow_dispatch:
    inputs:
      date:
        description: "投稿対象日 (YYYY-MM-DD)。空なら本日。"
        required: false
      dry_run:
        description: "投稿せず内容だけ表示する"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: daily-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 依存関係をインストール
        # cli は generate / render を読み込むため、投稿だけでも一式が要る。
        # ブラウザ本体は描画しないので入れない。
        run: pip install -r requirements.txt

      - name: 投稿
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          PAGES_BASE_URL: ${{ vars.PAGES_BASE_URL || 'https://wyattfuji1220.github.io/Instagram-assets' }}
          IG_API_HOST: ${{ vars.IG_API_HOST || 'https://graph.facebook.com' }}
          PYTHONPATH: src
        run: |
          python -m bookgram post \
            ${{ inputs.date && format('--date {0}', inputs.date) || '' }} \
            ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: これから配信する分のプレビューを更新
        if: ${{ !inputs.dry_run }}
        # 投稿が済んだ日をページから落とすため、投稿のたびに作り直す。
        continue-on-error: true
        env:
          PAGES_BASE_URL: ${{ vars.PAGES_BASE_URL || 'https://wyattfuji1220.github.io/Instagram-assets' }}
          PYTHONPATH: src
        run: python -m bookgram preview

      - name: 届き方の数字を記録
        if: ${{ !inputs.dry_run }}
        # 投稿の成否とは切り離す。数字が取れなくても投稿は成功扱いにする。
        continue-on-error: true
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_API_HOST: ${{ vars.IG_API_HOST || 'https://graph.facebook.com' }}
          PYTHONPATH: src
        run: python -m bookgram stats --limit 20

      - name: 投稿記録をコミット
        if: ${{ !inputs.dry_run }}
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain)" ]; then
            echo "記録の変更はありません。"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "投稿記録と反応の数字: $(date -u -d '+9 hours' +%Y-%m-%d)"
          git push origin main

      - name: 失敗を通知
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONPATH: src
        # 書影が無くて止まった場合が多いので、該当書を本文に載せる。
        # ログを開かなくても、何を確認すればいいかが分かるようにする。
        run: |
          {
            echo "ログ: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo
            echo '```'
            python -m bookgram covers 2>&1 || true
            echo '```'
          } > issue-body.md
          gh issue create --title "投稿に失敗しました ($(date -u -d '+9 hours' +%Y-%m-%d))" --body-file issue-body.md
