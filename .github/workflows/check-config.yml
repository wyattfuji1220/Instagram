name: 設定の点検

# Secrets は仕組み上どこからも値を読み出せないため、Actions の中で実際に
# API を叩いて確かめ、結果だけを output/config-check.md に書き戻します。
# 資格情報そのものは一切出力しません（doctor は値を印字しません）。
# 音源ライブラリは設定の有無ではなく、実際に検索して確かめます。
# (FB_* の Secrets 登録後の再点検)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/check-config.yml"

permissions:
  contents: write

concurrency:
  group: check-config
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 依存関係をインストール
        # cli は generate / render を読み込むため、投稿だけでも一式が要る。
        # ブラウザ本体は描画しないので入れない。
        run: pip install -r requirements.txt

      - name: 点検して結果を書き出す
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
          FB_IG_USER_ID: ${{ secrets.FB_IG_USER_ID }}
          FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}
          FB_APP_ID: ${{ secrets.FB_APP_ID }}
          FB_APP_SECRET: ${{ secrets.FB_APP_SECRET }}
          GOOGLE_BOOKS_API_KEY: ${{ secrets.GOOGLE_BOOKS_API_KEY }}
          RAKUTEN_REFERER: ${{ vars.RAKUTEN_REFERER || format('{0}/{1}', github.server_url, github.repository) }}
          PAGES_BASE_URL: ${{ vars.PAGES_BASE_URL || 'https://wyattfuji1220.github.io/Instagram-assets' }}
          IG_API_HOST: ${{ vars.IG_API_HOST || 'https://graph.facebook.com' }}
          PYTHONPATH: src
          # Secrets と Variables のどちらに入っているかを切り分けるための確認用。
          # 値は出力せず、入っているかどうかだけを見る。
          PROBE_SECRET_FB_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}
          PROBE_SECRET_FB_USER: ${{ secrets.FB_IG_USER_ID }}
          PROBE_SECRET_FB_APP: ${{ secrets.FB_APP_ID }}
          PROBE_SECRET_FB_SECRET: ${{ secrets.FB_APP_SECRET }}
          PROBE_SECRET_GOOGLE: ${{ secrets.GOOGLE_BOOKS_API_KEY }}
          PROBE_VAR_FB_TOKEN: ${{ vars.FB_ACCESS_TOKEN }}
          PROBE_VAR_FB_USER: ${{ vars.FB_IG_USER_ID }}
        run: |
          mkdir -p output
          probe() {
            if [ -n "$2" ]; then echo "  $1: 入っています"; else echo "  $1: 空です"; fi
          }
          {
            echo "# GitHub Actions 上での設定点検"
            echo
            echo "実行: $(date -u -d '+9 hours' +'%Y-%m-%d %H:%M') JST"
            echo
            echo '```'
            python -m bookgram doctor 2>&1 || true
            echo '```'
            echo
            echo "## 音源用の設定はどこに入っているか"
            echo
            echo '```'
            echo "Secrets 側"
            probe FB_ACCESS_TOKEN "$PROBE_SECRET_FB_TOKEN"
            probe FB_IG_USER_ID "$PROBE_SECRET_FB_USER"
            probe FB_APP_ID "$PROBE_SECRET_FB_APP"
            probe FB_APP_SECRET "$PROBE_SECRET_FB_SECRET"
            probe GOOGLE_BOOKS_API_KEY "$PROBE_SECRET_GOOGLE"
            echo "Variables 側"
            probe FB_ACCESS_TOKEN "$PROBE_VAR_FB_TOKEN"
            probe FB_IG_USER_ID "$PROBE_VAR_FB_USER"
            echo '```'
          } > output/config-check.md
          cat output/config-check.md

      - name: 結果をコミット
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain output/config-check.md)" ]; then
            echo "結果に変化はありません。"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/config-check.md
          git commit -m "点検: Actions 上の設定確認結果"
          git push origin main
