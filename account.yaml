# キャプションの締めに入れる問いかけ。日付ごとに順番に使われます。
#
# コメントは、いいねよりアルゴリズムに効きます。ただし「おすすめの本を
# 教えてください」のような問いは、本を思い出して書名を打つ必要があり、
# 答えるのに手間がかかりすぎます。1秒で答えが決まるものだけを並べます。
closing_questions:
  - "ちなみに、朝読む派ですか？ 夜読む派ですか？"
  - "積読、いま何冊ありますか？"
  - "この本、読んだことありますか？　あるなら「読んだ」だけでも嬉しいです。"
  - "紙の本と電子書籍、どちら派ですか？"
  - "月に何冊くらい読みますか？　数字だけでも教えてください。"
  - "読書はどこでしますか？　家／通勤中／カフェ、どれでしょう。"
  - "気になった方は「📖」とだけコメントいただけると嬉しいです。"
  - "「読みたい」か「もう読んだ」か、どちらでしょうか？"
  - "本を選ぶとき、表紙とタイトルどちらを先に見ますか？"
  - "読み終わった本、売る派ですか？　残す派ですか？"

# 新刊特集の表紙に固定で入れる一言
